name: Deploy Pages

on:
  release:
    types: [published]

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          TAG=${{ github.event.release.tag_name }}
          VERSION=${TAG#v}
          BASE="https://github.com/anarsoul/esp32-bthidbridge/releases/download/$TAG"
          jq -n \
            --arg name "ESP32 BT HID Bridge" \
            --arg version "$VERSION" \
            --arg bootloader "$BASE/bootloader.bin" \
            --arg partitions "$BASE/partition-table.bin" \
            --arg app "$BASE/bthidbridge.bin" \
            '{
              name: $name,
              version: $version,
              builds: [{
                chipFamily: "ESP32",
                parts: [
                  {path: $bootloader, offset: 4096},
                  {path: $partitions, offset: 32768},
                  {path: $app,        offset: 65536}
                ]
              }]
            }' > docs/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
