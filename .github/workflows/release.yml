name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          cp build/bootloader/bootloader.bin artifacts/
          cp build/partition_table/partition-table.bin artifacts/
          cp build/bthidbridge.bin artifacts/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/bootloader.bin
            firmware/partition-table.bin
            firmware/bthidbridge.bin

      - name: Generate manifest.json
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          BASE="https://github.com/anarsoul/esp32-bthidbridge/releases/download/$TAG"
          jq -n \
            --arg name "ESP32 BT HID Bridge" \
            --arg version "$VERSION" \
            --arg bootloader "$BASE/bootloader.bin" \
            --arg partitions "$BASE/partition-table.bin" \
            --arg app "$BASE/bthidbridge.bin" \
            '{
              name: $name,
              version: $version,
              builds: [{
                chipFamily: "ESP32",
                parts: [
                  {path: $bootloader, offset: 4096},
                  {path: $partitions, offset: 32768},
                  {path: $app,        offset: 65536}
                ]
              }]
            }' > docs/manifest.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
